# Render Blueprint - deploys this repo as a free public web service.
# Push the repo to GitHub, then in Render choose "New +" -> "Blueprint"
# and point it at the repository. Render reads this file and builds it.
services:
  - type: web
    name: scientific-calculator
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
