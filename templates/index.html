<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scientific Calculator</title>
<link rel="icon" href="data:,">

<style>
:root {
    color-scheme: dark;
    --bg: #101827;
    --panel: #1c293b;
    --key: #2b3b52;
    --accent: #f0a743;
    --text: #f5f7fb;
    --muted: #9eacc0;
}
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 12px;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #243a58, var(--bg) 65%);
    font-family: system-ui, Arial, sans-serif;
    color: var(--text);
}

.calculator {
    width: min(100%, 430px);
    padding: 22px;
    border: 1px solid #40516a;
    border-radius: 24px;
    background: var(--panel);
    box-shadow: 0 20px 60px #0006;
}

h1 {
    font-size: 20px;
    margin: 0 0 5px;
}
.subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 18px;
}

.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 12px;
}
select {
    background: var(--key);
    color: var(--text);
    padding: 8px;
    border: 0;
    border-radius: 8px;
}

#display {
    width: 100%;
    height: 76px;
    padding: 14px;
    border: 1px solid #40516a;
    border-radius: 13px;
    background: #111c2b;
    color: var(--text);
    font-size: clamp(23px, 6vw, 32px);
    text-align: right;
    margin-bottom: 16px;
}

.keys {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 9px;
}

button {
    min-width: 0;
    min-height: 49px;
    border: 0;
    border-radius: 11px;
    background: var(--key);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    transition: filter .15s, transform .1s;
}
button:hover { filter: brightness(1.2); }
button:active { transform: scale(.96); }
button.function { color: #bcd5ff; }
button.operator { color: var(--accent); }
button.clear { background: #773c48; }
button.equal {
    background: var(--accent);
    color: #1b2430;
    font-weight: 800;
}
button.wide { grid-column: span 2; }
#status {
    min-height: 18px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
}
.hint {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
}
footer {
    text-align: center;
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
}
@media (max-width: 360px) {
    .calculator { padding: 14px; }
    .keys { gap: 6px; }
    button { min-height: 45px; font-size: 14px; }
}
</style>
</head>

<body>
<main class="calculator">
    <h1>Scientific Calculator</h1>
    <div class="subtitle">Simple tools. Powerful mathematics.</div>

    <div class="toolbar">
        <span>Angle mode</span>
        <select id="mode" aria-label="Angle mode">
            {% for angle_mode in angle_modes %}
            <option value="{{ angle_mode }}"
                {%- if angle_mode == default_mode %} selected{% endif %}>{{ angle_mode }}</option>
            {% endfor %}
        </select>
    </div>

    <input id="display" value="0" readonly
        aria-label="Calculator display">

    <div class="keys">
        <button class="clear" data-action="clear">AC</button>
        <button data-action="delete">DEL</button>
        <button class="function" data-value="(">(</button>
        <button class="function" data-value=")">)</button>
        <button class="function" data-value="%">mod</button>

        <button class="function" data-value="sin(">sin</button>
        <button class="function" data-value="cos(">cos</button>
        <button class="function" data-value="tan(">tan</button>
        <button class="function" data-value="sqrt(">&#8730;</button>
        <button class="operator" data-value="**">x&#8319;</button>

        <button class="function" data-value="asin(">sin&#8315;&#185;</button>
        <button class="function" data-value="acos(">cos&#8315;&#185;</button>
        <button class="function" data-value="atan(">tan&#8315;&#185;</button>
        <button class="function" data-value="log(">log</button>
        <button class="function" data-value="ln(">ln</button>

        <button class="function" data-value="exp(">exp</button>
        <button class="function wide" data-value="abs(">abs</button>
        <button class="function" data-value="**2">x&#178;</button>
        <button class="function" data-value="pi">&#960;</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="function" data-value="e">e</button>
        <button class="operator" data-value="/">&#247;</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-action="sign">&#177;</button>
        <button class="operator" data-value="*">&#215;</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value=".">.</button>
        <button class="operator" data-value="-">&#8722;</button>

        <button class="wide" data-value="0">0</button>
        <button class="operator" data-value="+">+</button>
        <button class="equal wide" data-action="equals">=</button>
    </div>

    <div id="status" role="status" aria-live="polite">
        Ready
    </div>
    <div class="hint">
        Implicit multiplication is supported: 2&#960;, 3(4+5), 2sin(30).
    </div>
    <footer>Runs locally or on your hosted website</footer>
</main>
<script>
const display = document.getElementById("display");
const status = document.getElementById("status");
const mode = document.getElementById("mode");

// Sent by the server from dialect.VALUE_STARTER_KEYS, so the keypad and the
// normalizer that evaluates the expression always agree.
// Jinja's "tojson" encoder turns the server's sequence into a JavaScript array.
const STARTS_NEW_VALUE = {{ value_starter_keys | tojson }}; {# cSpell:ignore tojson #}

const ERROR_TEXT = "Error";
const ERROR_VALUES = ["Error", "Server error"];
const READY_TEXT = "Ready";

let justCalculated = false;

function resetIfError() {
    if (ERROR_VALUES.includes(display.value)) {
        display.value = "0";
        justCalculated = false;
    }
}

function startsNewValue(value) {
    return /^[0-9]$/.test(value) || value === "." || STARTS_NEW_VALUE.includes(value);
}

function append(value) {
    resetIfError();

    const isDecimal = value === ".";

    if (justCalculated && startsNewValue(value)) {
        display.value = "0";
    }
    justCalculated = false;

    if (display.value === "0" && startsNewValue(value)) {
        display.value = isDecimal ? "0." : value;
    } else if (isDecimal && /(^|[+\-*/%^(])$/.test(display.value)) {
        display.value += "0.";
    } else {
        display.value += value;
    }

    status.textContent = READY_TEXT;
}

function clearDisplay() {
    display.value = "0";
    justCalculated = false;
    status.textContent = READY_TEXT;
}

function deleteLast() {
    resetIfError();
    display.value = display.value.slice(0, -1) || "0";
    justCalculated = false;
    status.textContent = READY_TEXT;
}

function changeSign() {
    resetIfError();
    if (display.value === "0") return;

    const wrapped = "-(" + display.value + ")";
    const unwrapped = display.value.slice(2, -1);

    if (display.value.startsWith("-(") && display.value.endsWith(")")) {
        display.value = unwrapped || "0";
    } else {
        display.value = wrapped;
    }

    justCalculated = false;
    status.textContent = READY_TEXT;
}

async function readJson(response) {
    try {
        return await response.json();
    } catch (error) {
        return null;
    }
}

function showFailure(message) {
    status.textContent = message;
    display.value = "Error";
    justCalculated = false;
}

async function calculate() {
    resetIfError();

    const expression = display.value;
    status.textContent = "Calculating…";

    try {
        const response = await fetch("{{ url_for('calculate') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                expression: expression,
                mode: mode.value
            })
        });

        const data = await readJson(response);

        if (!response.ok) {
            showFailure((data && data.error) || "Calculation failed.");
            return;
        }

        if (!data || typeof data.result !== "number") {
            display.value = "Error";
            status.textContent = "The server returned an unexpected response.";
            justCalculated = false;
            return;
        }

        display.value = String(data.result);
        status.textContent = "Calculation complete";
        justCalculated = true;

    } catch (error) {
        display.value = "Error";
        status.textContent = "Could not reach the Python server.";
        justCalculated = false;
    }
}

document.querySelector(".keys").addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button) return;

    if (button.dataset.value !== undefined) {
        append(button.dataset.value);
        return;
    }

    switch (button.dataset.action) {
        case "clear": clearDisplay(); break;
        case "delete": deleteLast(); break;
        case "sign": changeSign(); break;
        case "equals": calculate(); break;
    }
});

document.addEventListener("keydown", event => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;

    if (/^[0-9.]$/.test(event.key)) append(event.key);
    else if (["+", "-", "*", "/", "%", "(", ")"].includes(event.key))
        append(event.key);
    else if (event.key === "Enter" || event.key === "=") calculate();
    else if (event.key === "Backspace") deleteLast();
    else if (event.key === "Escape") clearDisplay();
});

mode.addEventListener("change", () => {
    status.textContent = "Angle mode set to " + mode.value;
});
</script>
</body>
</html>
